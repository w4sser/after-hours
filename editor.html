<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>After Hours — Card Editor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; color: #EDE0C8; font-family: 'Inter', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
button { font-family: inherit; cursor: pointer; }

/* TOP BAR */
#topbar {
  background: #111;
  border-bottom: 1px solid rgba(237,224,200,0.08);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
#prompt-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#prompt-counter { font-size: 12px; color: #9A8E7E; font-variant-numeric: tabular-nums; }
#mood-badge { background: rgba(237,224,200,0.08); color: #9A8E7E; padding: 2px 8px; border-radius: 4px; font-size: 10px; letter-spacing: 1px; }
#accepts-label { font-size: 11px; color: #9A8E7E; }
#accepts-label strong { color: #EDE0C8; }

#topbar-right { display: flex; align-items: center; gap: 8px; }
.name-input {
  width: 72px;
  background: #1A1917;
  border: 1px solid rgba(237,224,200,0.15);
  color: #EDE0C8;
  padding: 4px 7px;
  border-radius: 5px;
  font-size: 12px;
  font-family: inherit;
}
.name-input:focus { outline: none; border-color: rgba(237,224,200,0.35); }
.sep { color: #6B5F52; font-size: 11px; }
#nav-btns { display: flex; gap: 6px; }
.btn-nav {
  background: #1A1917;
  border: 1px solid rgba(237,224,200,0.15);
  color: #9A8E7E;
  padding: 5px 14px;
  border-radius: 6px;
  font-size: 12px;
  transition: border-color 0.15s;
}
.btn-nav:hover { border-color: rgba(237,224,200,0.3); color: #EDE0C8; }
.btn-nav.primary { background: #EDE0C8; color: #111; border-color: #EDE0C8; font-weight: 600; }
.btn-nav.primary:hover { background: #F5EDD8; }

#mode-tabs { display: flex; gap: 4px; margin-right: 12px; }
.tab {
  background: transparent;
  border: 1px solid rgba(237,224,200,0.15);
  color: #9A8E7E;
  padding: 5px 14px;
  border-radius: 6px;
  font-size: 12px;
  transition: border-color 0.15s;
}
.tab:hover { border-color: rgba(237,224,200,0.3); }
.tab.active { background: #EDE0C8; color: #111; border-color: #EDE0C8; font-weight: 600; }

/* PROMPT */
#prompt-area {
  background: #151412;
  border-bottom: 1px solid rgba(237,224,200,0.06);
  padding: 16px 20px;
  flex-shrink: 0;
}
#prompt-text { font-size: 16px; line-height: 1.65; color: #EDE0C8; }
#prompt-text .blank {
  background: rgba(237,224,200,0.12);
  padding: 0 8px;
  border-radius: 4px;
  color: #EDE0C8;
}

/* ANSWERS */
#answers-area {
  flex: 1;
  overflow-y: auto;
  padding: 10px 20px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.answer-row {
  background: #1A1917;
  border: 1px solid rgba(237,224,200,0.08);
  border-radius: 8px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  transition: opacity 0.15s;
}
.answer-row.skipped {
  opacity: 0.35;
  border-color: rgba(237,224,200,0.04);
}
.answer-row.is-new {
  border-color: rgba(237,224,200,0.22);
}
.answer-left { flex: 1; min-width: 0; }
.answer-sentence {
  font-size: 13px;
  color: #EDE0C8;
  line-height: 1.5;
}
.answer-sentence.struck { text-decoration: line-through; }
.answer-sentence strong { color: #EDE0C8; }
.answer-type {
  font-size: 10px;
  color: #6B5F52;
  margin-top: 3px;
}
.answer-type .new-badge { color: #9A8E7E; }

.btn-skip {
  background: transparent;
  border: 1px solid rgba(237,224,200,0.12);
  color: #6B5F52;
  padding: 4px 12px;
  border-radius: 5px;
  font-size: 11px;
  flex-shrink: 0;
  transition: border-color 0.15s, color 0.15s;
}
.btn-skip:hover { border-color: rgba(237,224,200,0.3); color: #9A8E7E; }

/* ADD PANEL */
#add-panel {
  flex-shrink: 0;
  margin: 0 20px 10px;
  border: 1px dashed rgba(237,224,200,0.15);
  border-radius: 8px;
  padding: 10px 14px;
  background: #131211;
}
#add-panel-label {
  font-size: 10px;
  letter-spacing: 1px;
  color: #6B5F52;
  text-transform: uppercase;
  margin-bottom: 8px;
}
#add-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
#add-en {
  flex: 1;
  min-width: 200px;
  background: #1A1917;
  border: 1px solid rgba(237,224,200,0.2);
  color: #EDE0C8;
  padding: 6px 10px;
  border-radius: 5px;
  font-size: 13px;
  font-family: inherit;
}
#add-en:focus { outline: none; border-color: rgba(237,224,200,0.4); }
#add-en::placeholder { color: #6B5F52; }
#add-type {
  background: #1A1917;
  border: 1px solid rgba(237,224,200,0.2);
  color: #EDE0C8;
  padding: 6px 10px;
  border-radius: 5px;
  font-size: 13px;
  font-family: inherit;
}
#add-type:focus { outline: none; }
.btn-add {
  background: #252420;
  border: 1px solid rgba(237,224,200,0.3);
  color: #EDE0C8;
  padding: 7px 16px;
  border-radius: 6px;
  font-size: 13px;
  transition: border-color 0.15s;
}
.btn-add:hover { border-color: rgba(237,224,200,0.6); }
#add-hint { font-size: 10px; color: #6B5F52; margin-top: 6px; }

/* REVIEW MODE */
#review-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px 20px;
  gap: 16px;
  overflow-y: auto;
}
#review-progress {
  font-size: 12px;
  color: #9A8E7E;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
#review-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #1A1917;
  border: 1px solid rgba(237,224,200,0.1);
  border-radius: 14px;
  padding: 28px 24px;
  text-align: center;
  gap: 14px;
  min-height: 0;
}
#review-meta { display: flex; gap: 8px; }
#review-mood {
  background: rgba(237,224,200,0.08);
  color: #9A8E7E;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  letter-spacing: 1px;
}
#review-type { font-size: 10px; color: #6B5F52; padding: 2px 0; letter-spacing: 1px; }
#review-sentence { font-size: 19px; line-height: 1.6; color: #EDE0C8; max-width: 560px; }
#review-sentence strong { color: #F5EDD8; }
#review-done { text-align: center; color: #9A8E7E; font-size: 15px; line-height: 1.8; padding: 40px 0; }
#review-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  flex-shrink: 0;
}
.rate-btn {
  background: #1A1917;
  border: 1px solid rgba(237,224,200,0.15);
  color: #EDE0C8;
  padding: 16px 8px;
  border-radius: 10px;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: border-color 0.15s;
}
.rate-btn:hover { border-color: rgba(237,224,200,0.35); }
.key-hint { font-size: 10px; color: #6B5F52; }
@media (max-width: 600px) {
  #review-buttons { grid-template-columns: 1fr 1fr; }
  .rate-btn { padding: 18px 8px; }
  .key-hint { display: none; }
  #review-sentence { font-size: 17px; }
}

/* FOOTER */
#footer {
  flex-shrink: 0;
  border-top: 1px solid rgba(237,224,200,0.06);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #111;
}
#footer-status { font-size: 11px; color: #6B5F52; }
.btn-export {
  background: #1A1917;
  border: 1px solid rgba(237,224,200,0.3);
  color: #EDE0C8;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 12px;
  transition: border-color 0.15s;
}
.btn-export:hover { border-color: #EDE0C8; }
#copy-flash { color: #32CD32; font-size: 11px; opacity: 0; transition: opacity 0.3s; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<div id="topbar">
  <div id="mode-tabs">
    <button class="tab active" id="tab-browse" onclick="setMode('browse')">Browse</button>
    <button class="tab" id="tab-review" onclick="setMode('review')">Review</button>
  </div>
  <div id="prompt-meta">
    <span id="prompt-counter">PROMPT 1 / 64</span>
    <span id="mood-badge">FUN</span>
    <span id="accepts-label"></span>
  </div>
  <div id="topbar-right">
    <input class="name-input" id="p1name" value="Robert">
    <span class="sep">&amp;</span>
    <input class="name-input" id="p2name" value="Jannika">
    <div class="sep" style="width:1px;height:18px;background:rgba(237,224,200,0.1);margin:0 2px;"></div>
    <div id="nav-btns">
      <button class="btn-nav" id="btn-prev" onclick="navigate(-1)">← Prev</button>
      <button class="btn-nav primary" id="btn-next" onclick="navigate(1)">Next →</button>
    </div>
  </div>
</div>

<div id="prompt-area">
  <div id="prompt-text"></div>
</div>

<div id="answers-area"></div>

<div id="review-area" style="display:none;">
  <div id="review-progress"></div>
  <div id="review-card">
    <div id="review-meta">
      <span id="review-mood"></span>
      <span id="review-type"></span>
    </div>
    <div id="review-sentence"></div>
  </div>
  <div id="review-done" style="display:none;">All combos reviewed 🎉<br>Export cards.js to save your keepers.</div>
  <div id="review-buttons">
    <button class="rate-btn" onclick="rateCombo('funny')">😂 Funny<span class="key-hint">1</span></button>
    <button class="rate-btn" onclick="rateCombo('ok')">👍 OK<span class="key-hint">2</span></button>
    <button class="rate-btn" onclick="rateCombo('doesntwork')">🔧 Doesn't work<span class="key-hint">3</span></button>
    <button class="rate-btn" onclick="rateCombo('notfunny')">😐 Not funny<span class="key-hint">4</span></button>
  </div>
</div>

<div id="add-panel">
  <div id="add-panel-label">+ Add new answer</div>
  <div id="add-form">
    <input id="add-en" type="text" placeholder="Write a new answer...">
    <select id="add-type">
      <option value="np">Thing</option>
      <option value="gp">Activity</option>
      <option value="qf">Quote</option>
      <option value="ap">Description</option>
    </select>
    <button class="btn-add" onclick="addAnswer()">Add ↵</button>
  </div>
  <div id="add-hint"></div>
</div>

<div id="footer">
  <span id="footer-status">Skips are per-prompt · progress saved in browser</span>
  <div style="display:flex;align-items:center;gap:8px;">
    <span id="copy-flash">Copied ✓</span>
    <button class="btn-export" onclick="copyRatings()">💬 Copy ratings</button>
    <button class="btn-export" onclick="copyCards()">📋 Copy cards.js</button>
    <button class="btn-export" onclick="exportCards()">⬇ Export cards.js</button>
  </div>
</div>

  { mood:"fun", accepts:["np","gp"], en:"The most ridiculous thing {p1} and {p2} have ever argued about is ___", sv:"Det mest absurda {p1} och {p2} någonsin bråkat om är ___" },

var TYPE_LABELS = { np: 'Thing', gp: 'Activity', qf: 'Quote', ap: 'Description' };
var TYPE_CODES  = { 'Thing': 'np', 'Activity': 'gp', 'Quote': 'qf', 'Description': 'ap' };
var STATE_KEY = 'after-hours-editor-state';

var state = { currentIdx: 0, skips: {}, newAnswers: [], ratings: {}, candidateStatus: {}, mode: 'browse' };

function loadState() {
  try {
    var saved = localStorage.getItem(STATE_KEY);
    if (saved) state = JSON.parse(saved);
  } catch(e) {}
  if (!state.skips) state.skips = {};
  if (!state.newAnswers) state.newAnswers = [];
  if (!state.ratings) state.ratings = {};
  if (!state.candidateStatus) state.candidateStatus = {};
  if (!state.mode) state.mode = 'browse';
}

function saveState() {
  localStorage.setItem(STATE_KEY, JSON.stringify(state));
}

function sub(text) {
  var p1 = document.getElementById('p1name').value || 'Player 1';
  var p2 = document.getElementById('p2name').value || 'Player 2';
  return text.replace(/\{p1\}/g, p1).replace(/\{p2\}/g, p2);
}

function allAnswers() {
  return ANSWERS.concat(state.newAnswers);
}

function getSkips(promptIdx) {
  return state.skips[promptIdx] || [];
}

function toggleSkip(promptIdx, answerIdx) {
  var skips = getSkips(promptIdx);
  var pos = skips.indexOf(answerIdx);
  if (pos === -1) skips.push(answerIdx);
  else skips.splice(pos, 1);
  state.skips[promptIdx] = skips;
  saveState();
  render();
}

function navigate(dir) {
  state.currentIdx = (state.currentIdx + dir + PROMPTS.length) % PROMPTS.length;
  saveState();
  render();
}

function buildSentence(promptEn, answerEn) {
  var p = sub(promptEn);
  var a = sub(answerEn);
  if (p.indexOf('___') !== -1) {
    return p.replace('___', '<strong>' + a + '</strong>');
  }
  return p + ' <strong>' + a + '</strong>';
}

function countCompatible(type) {
  var count = 0;
  PROMPTS.forEach(function(p) { if (p.accepts.indexOf(type) !== -1) count++; });
  return count;
}

function render() {
  var idx = state.currentIdx;
  var prompt = PROMPTS[idx];
  var skips = getSkips(idx);
  var answers = allAnswers();

  // Counter
  document.getElementById('prompt-counter').textContent = 'PROMPT ' + (idx + 1) + ' / ' + PROMPTS.length;

  // Mood
  document.getElementById('mood-badge').textContent = prompt.mood.toUpperCase();

  // Accepts label
  var labels = prompt.accepts.map(function(t) { return '<strong>' + (TYPE_LABELS[t] || t) + '</strong>'; });
  document.getElementById('accepts-label').innerHTML = 'accepts: ' + labels.join(' · ');

  // Prompt text
  var pText = sub(prompt.en).replace('___', '<span class="blank">___</span>');
  document.getElementById('prompt-text').innerHTML = pText;

  // Add hint
  var moodLabel = prompt.mood.charAt(0).toUpperCase() + prompt.mood.slice(1);
  document.getElementById('add-hint').textContent =
    'Mood auto-set from this prompt (' + moodLabel + '). New answer appears in all prompts accepting this type.';

  // Answers: compatible ones first, then skipped
  var active = [];
  var skipped = [];

  answers.forEach(function(a, i) {
    if (prompt.accepts.indexOf(a.type) === -1) return;
    if (skips.indexOf(i) !== -1) skipped.push({ a: a, i: i });
    else active.push({ a: a, i: i });
  });

  var html = '';

  active.forEach(function(obj) {
    var isNew = obj.i >= ANSWERS.length;
    var newNote = isNew ? ' · <span class="new-badge">new · also in ' + countCompatible(obj.a.type) + ' prompts</span>' : '';
    html += '<div class="answer-row' + (isNew ? ' is-new' : '') + '">' +
      '<div class="answer-left">' +
        '<div class="answer-sentence">' + buildSentence(prompt.en, obj.a.en) + '</div>' +
        '<div class="answer-type">' + (TYPE_LABELS[obj.a.type] || obj.a.type) + newNote + '</div>' +
      '</div>' +
      '<button class="btn-skip" onclick="toggleSkip(' + idx + ',' + obj.i + ')">Skip here</button>' +
    '</div>';
  });

  skipped.forEach(function(obj) {
    html += '<div class="answer-row skipped">' +
      '<div class="answer-left">' +
        '<div class="answer-sentence struck">' + buildSentence(prompt.en, obj.a.en) + '</div>' +
        '<div class="answer-type">' + (TYPE_LABELS[obj.a.type] || obj.a.type) + ' · skipped for this prompt</div>' +
      '</div>' +
      '<button class="btn-skip" onclick="toggleSkip(' + idx + ',' + obj.i + ')">Restore</button>' +
    '</div>';
  });

  if (html === '') {
    html = '<div style="color:#6B5F52;font-size:13px;padding:12px 0;">No compatible answers for this prompt.</div>';
  }

  document.getElementById('answers-area').innerHTML = html;

  // Footer status
  var skipCount = 0;
  Object.values(state.skips).forEach(function(arr) { skipCount += arr.length; });
  document.getElementById('footer-status').textContent =
    'Skips are per-prompt · ' + skipCount + ' total skips · ' + state.newAnswers.length + ' new answers added';
}

function addAnswer() {
  var en = document.getElementById('add-en').value.trim();
  if (!en) return;
  var typeLabel = document.getElementById('add-type').value;
  var type = TYPE_CODES[typeLabel] || typeLabel;
  var mood = PROMPTS[state.currentIdx].mood;
  state.newAnswers.push({ mood: mood, type: type, en: en, sv: '' });
  saveState();
  document.getElementById('add-en').value = '';
  render();
}

var currentCombo = null;

function moodCompatible(a, b) {
  return a === b || a === 'mix' || b === 'mix';
}

function candidateRatedMap() {
  var m = {};
  Object.keys(state.ratings).forEach(function(k) { m[k.split('|')[0]] = true; });
  return m;
}

function unratedCombos() {
  var out = [];
  CANDIDATES.forEach(function(c) {
    if (state.candidateStatus[c.id] === 'killed') return;
    PROMPTS.forEach(function(p, pi) {
      if (p.accepts.indexOf(c.type) === -1) return;
      if (!moodCompatible(c.mood, p.mood)) return;
      if (state.ratings[c.id + '|' + pi]) return;
      out.push({ c: c, pi: pi });
    });
  });
  return out;
}

function pickNextCombo() {
  var combos = unratedCombos();
  if (combos.length === 0) return null;
  var rated = candidateRatedMap();
  var fresh = combos.filter(function(x) { return !rated[x.c.id]; });
  var pool = fresh.length ? fresh : combos;
  return pool[Math.floor(Math.random() * pool.length)];
}

function reviewCounts() {
  var approved = 0, killed = 0;
  CANDIDATES.forEach(function(c) {
    if (state.candidateStatus[c.id] === 'approved') approved++;
    else if (state.candidateStatus[c.id] === 'killed') killed++;
  });
  var rated = candidateRatedMap();
  var unseen = CANDIDATES.filter(function(c) { return !rated[c.id]; }).length;
  return { approved: approved, killed: killed, unseen: unseen };
}

function renderReview() {
  var counts = reviewCounts();
  document.getElementById('review-progress').textContent =
    'approved ' + counts.approved + ' · killed ' + counts.killed + ' · unseen ' + counts.unseen;
  currentCombo = pickNextCombo();
  var done = !currentCombo;
  document.getElementById('review-card').style.display = done ? 'none' : 'flex';
  document.getElementById('review-buttons').style.display = done ? 'none' : 'grid';
  document.getElementById('review-done').style.display = done ? 'block' : 'none';
  if (done) return;
  var p = PROMPTS[currentCombo.pi];
  var c = currentCombo.c;
  document.getElementById('review-mood').textContent = p.mood.toUpperCase();
  document.getElementById('review-type').textContent = (TYPE_LABELS[c.type] || c.type) + ' · ' + c.id;
  document.getElementById('review-sentence').innerHTML = buildSentence(p.en, c.en);
}

function rateCombo(rating) {
  if (!currentCombo) return;
  var c = currentCombo.c, pi = currentCombo.pi;
  state.ratings[c.id + '|' + pi] = rating;
  if (rating === 'funny' || rating === 'ok') {
    state.candidateStatus[c.id] = 'approved';
  } else if (rating === 'notfunny' && state.candidateStatus[c.id] !== 'approved') {
    state.candidateStatus[c.id] = 'killed';
  }
  saveState();
  renderReview();
}

document.addEventListener('keydown', function(e) {
  if (state.mode !== 'review') return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  var map = { '1': 'funny', '2': 'ok', '3': 'doesntwork', '4': 'notfunny' };
  if (map[e.key]) rateCombo(map[e.key]);
});

function setMode(m) {
  state.mode = m;
  saveState();
  var isReview = m === 'review';
  document.getElementById('tab-browse').className = 'tab' + (isReview ? '' : ' active');
  document.getElementById('tab-review').className = 'tab' + (isReview ? ' active' : '');
  ['prompt-meta', 'nav-btns', 'prompt-area', 'answers-area', 'add-panel'].forEach(function(id) {
    document.getElementById(id).style.display = isReview ? 'none' : '';
  });
  document.getElementById('review-area').style.display = isReview ? 'flex' : 'none';
  if (isReview) renderReview();
  else render();
}

document.getElementById('add-en').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addAnswer();
});

document.getElementById('p1name').addEventListener('input', render);
document.getElementById('p2name').addEventListener('input', render);

function buildExportText() {
  var approved = CANDIDATES.filter(function(c) { return state.candidateStatus[c.id] === 'approved'; });
  var base = ANSWERS.length + state.newAnswers.length;
  var candIdx = {};
  approved.forEach(function(c, i) { candIdx[c.id] = base + i; });

  var prompts = PROMPTS.map(function(p, pi) {
    // merge skips already baked into the prompt with this session's skips
    var skips = (p.skip || []).concat(getSkips(pi));
    approved.forEach(function(c) {
      var r = state.ratings[c.id + '|' + pi];
      if (r === 'doesntwork' || r === 'notfunny') skips.push(candIdx[c.id]);
    });
    skips = skips.filter(function(v, i) { return skips.indexOf(v) === i; });
    if (skips.length === 0) return p;
    var copy = Object.assign({}, p);
    copy.skip = skips;
    return copy;
  });

  var answers = ANSWERS.concat(state.newAnswers).concat(approved.map(function(c) {
    return { mood: c.mood, type: c.type, en: c.en, sv: c.sv };
  }));

  var lines = [];
  lines.push('// ── AFTER HOURS — CARD DATA ──');
  lines.push('// Blanks: ___ in prompts are rendered as highlighted gaps');
  lines.push('// Name tokens: {p1} and {p2} replaced with player names at runtime');
  lines.push('// Mood tags: "fun" | "deep" | "spicy" | "mix"');
  lines.push('// Grammar lanes: "np" | "gp" | "qf" | "ap"');
  lines.push('// Prompts have "accepts" — which answer types they pair with');
  lines.push('// Prompts have "skip" — answer indices excluded for this prompt');
  lines.push('// Answers have "type" — their grammar lane');
  lines.push('');
  lines.push('var PROMPTS = ' + JSON.stringify(prompts, null, 2) + ';');
  lines.push('');
  lines.push('var ANSWERS = ' + JSON.stringify(answers, null, 2) + ';');
  return lines.join('\n');
}

function exportCards() {
  var blob = new Blob([buildExportText()], { type: 'text/javascript' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'cards.js';
  a.click();
  URL.revokeObjectURL(url);
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(function() {
    var flash = document.getElementById('copy-flash');
    flash.style.opacity = '1';
    setTimeout(function() { flash.style.opacity = '0'; }, 1500);
  }, function() {
    alert('Copy failed — use the download button instead.');
  });
}

function copyCards() {
  copyToClipboard(buildExportText());
}

// Compact export for pasting into chat: just the ratings, no card data.
function copyRatings() {
  copyToClipboard(JSON.stringify({
    ratings: state.ratings,
    candidateStatus: state.candidateStatus,
    newAnswers: state.newAnswers,
    skips: state.skips
  }));
}

loadState();
setMode(state.mode);
</script>
</body>
</html>
